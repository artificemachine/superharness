[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superharness"
version = "1.82.1"
description = "Multi-agent session handoff framework for Claude Code and Codex CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.3.3",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "pydantic>=2.0,<3",
    "fastmcp>=0.4",
    "requests>=2.31",
    # CVE floors on FastMCP/MCP transitives (unpinned upstream, so forced here).
    # Keep these aligned with tests/contract/test_dependency_security_floors.py.
    "cryptography>=50.0.0",
    "idna>=3.15",
    "joserfc>=1.6.8",
    "mcp>=1.28.1,<3",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
observability = ["langfuse>=4.7,<5"]

[project.urls]
Homepage = "https://github.com/artificemachine/superharness"
Repository = "https://github.com/artificemachine/superharness"
Issues = "https://github.com/artificemachine/superharness/issues"

[project.scripts]
superharness = "superharness.cli:main"
shux = "superharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superharness = [
    "scripts/*",
    "engine/*.yaml",
    "module_templates/*.yaml",
    "adapter_manifests/*.yaml",
    "adapters/claude-code/*",
    "adapters/claude-code/hooks/*",
    "adapters/claude-code/.claude-plugin/*",
    "adapters/codex-cli/*",
    "adapters/codex-cli/**/*",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0.0",
    # Required by the Linux/macOS unit job in .github/workflows/tests.yml,
    # which passes --timeout=120. CI installed it ad hoc via pip while it was
    # declared nowhere, so a local `uv sync` produced an environment that
    # could not run the CI command.
    "pytest-timeout>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m \"not stress\""
# NOT `addopts = "-ra --strict-markers"` (the crossprose form) — on this
# repo's pytest (9.0.2), a --strict-markers flag embedded in addopts never
# reaches the override-ini mechanism (see
# tests/contract/test_pytest_config.py::test_addopts_enables_strict_markers
# docstring for the root cause) and silently downgrades to a warning. The
# native ini key below is what actually enforces it.
#
# `-m "not stress"` (Iteration 5 of PLAN-prime-agent-adoptions.md): unlike
# tests/perf/ (which has no exclusion mechanism at all — it is simply part
# of every default `pytest tests/` run, verified against the actual repo
# config rather than assumed from the plan), tests/stress/ spawns and
# SIGKILLs real subprocesses and must never run as part of a routine
# default invocation. A literal `-m` passed on the command line (e.g.
# `pytest tests/stress/ -m stress`) replaces this addopts value rather than
# ANDing with it — verified empirically on this repo's pytest (9.0.2) — so
# `pytest tests/stress/ -q -m stress` (used by nightly-stress.yml) still
# selects the stress-marked tests despite this default exclusion.
strict_markers = true
markers = [
    "requires_bash: test requires bash shell (skipped on Windows)",
    "regression: guards a specific past bug (cite the CHANGELOG entry or commit in the test docstring)",
    "network: reaches a real external service (LLM provider, remote git). Deselect with -m 'not network'.",
    "stress: spawns/signals real processes to reproduce operator failure modes. Excluded from the default run by addopts; run via `pytest tests/stress/ -m stress` (nightly in CI).",
]

[tool.coverage.run]
source = ["superharness"]

[tool.coverage.report]
fail_under = 56
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
