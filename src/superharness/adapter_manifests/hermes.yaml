name: hermes
version: "1"
schema_version: 2
description: >-
  Hermes Agent (Nous Research) via `hermes chat -Q`: a worker, and an
  orchestrator runtime run with the tool-less `safe` toolset. Hermes resolves
  its provider from its own config; runtime model bindings decide dispatch
  models when they bind this agent, and the tiers below are the fallback.
type: external
launcher_script: delegate-to-hermes.sh
capabilities:
  - code_generation
  - file_editing
strengths: [agent:hermes]
supports_effort: true  # maps to `hermes chat --reasoning`
# Provenance: both IDs are in Hermes v0.22.5's model catalog, and each answered
# a live call through delegate-to-hermes.sh on 2026-11-07 (deepseek-v4-flash
# through two hermes-owned tasks, deepseek-v4-pro with -m); see
# docs/reference/adapter-models.md.
model_tiers:
  mini:
    preferred: deepseek/deepseek-v4-flash
    accept: [deepseek/deepseek-v4-flash]
    auth_compat:
      apikey: [deepseek/deepseek-v4-flash]
    capability_tags: [cost_optimised]
  standard:
    preferred: deepseek/deepseek-v4-flash
    accept: [deepseek/deepseek-v4-flash]
    auth_compat:
      apikey: [deepseek/deepseek-v4-flash]
    capability_tags: [balanced]
  max:
    preferred: deepseek/deepseek-v4-pro
    accept: [deepseek/deepseek-v4-pro]
    auth_compat:
      apikey: [deepseek/deepseek-v4-pro]
    capability_tags: [best_effort]
requires:
  bin: hermes
  env: []
validation:
  check_bin: false # Don't block if not installed yet
  check_env: false
