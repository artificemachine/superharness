name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build and publish (e.g. v1.10.3)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  verify-ci:
    name: Verify Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required checks are green before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || github.event.release.tag_name || github.ref_name }}"
          echo "Verifying release gate for ref ${REF}"

          # Keep in sync with release.yml verify-ci and branch protection on main.
          # publish.yml has its own trigger surface (release:published, workflow_dispatch)
          # independent of release.yml, so it must re-verify rather than trust the caller.
          REQUIRED=("QA Gate" "Windows-Native Release Gate" "ShipGuard Scan" "Gitleaks")

          gh api "repos/${{ github.repository }}/commits/${REF}/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | {name, conclusion, started_at}' \
            | jq -s '.' > /tmp/check_runs.json

          echo "Found $(jq 'length' /tmp/check_runs.json) check run(s) on ${REF}"

          FAILED=0
          for name in "${REQUIRED[@]}"; do
            conclusion="$(jq -r --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.started_at) | last | .conclusion // "MISSING"' \
              /tmp/check_runs.json)"
            if [ "$conclusion" = "success" ]; then
              echo "  OK       ${name}: success"
            elif [ "$conclusion" = "MISSING" ] || [ "$conclusion" = "null" ]; then
              echo "  BLOCKED  ${name}: no check run found on ${REF}"
              FAILED=1
            else
              echo "  BLOCKED  ${name}: ${conclusion}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Refusing to publish ${REF} to PyPI — required checks are not green."
            exit 1
          fi

          echo ""
          echo "All required checks green on ${REF} — proceeding with publish."

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify dist contents
        run: |
          ls -la dist/
          tar -tzf dist/*.tar.gz | head -20

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
