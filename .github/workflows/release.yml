name: Release

# Fires only when a v* tag is pushed explicitly (via /ship-release or git push --tags).
# Merging PRs to main never triggers a release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create releases and tags
  actions: write    # needed to dispatch publish.yml via workflow_dispatch

jobs:
  # ---------------------------------------------------------------------------
  # Tagging is the one irreversible, outward-facing step in this repo: this
  # workflow creates the GitHub Release and dispatches publish.yml, which
  # uploads to PyPI. A PyPI version cannot be re-uploaded once taken.
  #
  # Until now nothing connected that to tests passing. The 2026-07-22 golive
  # audit (Stage 7) logged this as a real MEDIUM: release.yml fires on any v*
  # tag with zero automated dependency on tests.yml, so "CI must be green
  # before tagging" was pure process discipline with no backstop. A tag pushed
  # from a red commit — or from a local checkout that never ran CI — would
  # publish.
  #
  # This gate mirrors branch protection exactly: it requires the same check
  # contexts main requires, resolved against the tagged commit. It deliberately
  # does NOT check the Tests *workflow* conclusion, because that workflow also
  # contains non-required jobs (the pytest-xdist trial) whose failure must not
  # be able to block a release.
  #
  # Fails closed. There is no skip variable: a bypass that can be set once and
  # forgotten is exactly the fail-open pattern /ci-gate flags. If a tag's check
  # runs have aged out (GitHub retains them ~90 days), re-run CI on that commit
  # before releasing.
  # ---------------------------------------------------------------------------
  verify-ci:
    name: Verify required checks passed on the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Require branch-protection checks to be green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          echo "Tag ${GITHUB_REF_NAME} resolves to ${SHA}"

          # Keep in sync with branch protection on main:
          #   gh api repos/${GITHUB_REPOSITORY}/branches/main/protection \
          #     --jq '.required_status_checks.contexts'
          REQUIRED=("QA Gate" "Windows-Native Release Gate")

          gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | {name, conclusion, started_at}' \
            | jq -s '.' > /tmp/check_runs.json

          echo "Found $(jq 'length' /tmp/check_runs.json) check run(s) on ${SHA}"

          FAILED=0
          for name in "${REQUIRED[@]}"; do
            # A rerun creates a second check run with the same name — take the
            # most recently started one, which is the authoritative result.
            conclusion="$(jq -r --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.started_at) | last | .conclusion // "MISSING"' \
              /tmp/check_runs.json)"
            if [ "$conclusion" = "success" ]; then
              echo "  OK       ${name}: success"
            elif [ "$conclusion" = "MISSING" ] || [ "$conclusion" = "null" ]; then
              echo "  BLOCKED  ${name}: no check run found on this commit"
              FAILED=1
            else
              echo "  BLOCKED  ${name}: ${conclusion}"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Refusing to release ${GITHUB_REF_NAME}."
            echo ""
            echo "The checks main requires are not green on ${SHA}. Releasing would"
            echo "create a GitHub Release and publish to PyPI, which cannot be undone"
            echo "for that version number."
            echo ""
            echo "To resolve:"
            echo "  1. Push ${SHA} to a branch and let the Tests workflow run, or re-run"
            echo "     the existing failed jobs on that commit."
            echo "  2. Once QA Gate and Windows-Native Release Gate are green, delete and"
            echo "     re-push the tag:"
            echo "       git push --delete origin ${GITHUB_REF_NAME}"
            echo "       git push origin ${GITHUB_REF_NAME}"
            echo ""
            echo "If the check runs have simply aged out (GitHub retains them ~90 days),"
            echo "re-run CI on the commit rather than bypassing this gate."
            exit 1
          fi

          echo ""
          echo "All required checks green on ${SHA} — proceeding with release."

  release:
    name: Create GitHub Release
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for this version
        id: changelog
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the block between ## [VERSION] and the next ## [
          NOTES=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('CHANGELOG.md').read_text()
          pattern = rf'## \[{re.escape(\"$VERSION\")}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, text, re.DOTALL)
          print(m.group(1).strip() if m else 'See CHANGELOG.md for details.')
          ")
          # Write to file to handle multiline safely
          echo "$NOTES" > /tmp/release_notes.txt
          echo "notes_file=/tmp/release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "superharness ${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --latest

      # GitHub won't trigger publish.yml from a release created by GITHUB_TOKEN,
      # so we dispatch it explicitly via workflow_dispatch.
      - name: Trigger publish workflow
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml \
            --ref "${{ steps.version.outputs.tag }}"
