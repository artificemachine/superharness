name: Release

# Promotion of an approved release candidate to a tag and GitHub Release.
# Dispatch-only: the operator supplies the numeric candidate_release_id of
# the draft release created by candidate.yml (named candidate-<full-sha>)
# plus the approver identity. A manually pushed v* tag no longer triggers
# anything — tag creation is itself a workflow step, and it happens only
# after the candidate draft has been validated (draft=true, matching
# target_commitish, full-commit manifest, approval evidence) and required
# CI is green on the candidate commit.

on:
  workflow_dispatch:
    inputs:
      candidate_release_id:
        description: "Numeric GitHub release ID of the candidate draft (from candidate.yml)"
        required: true
        type: string
      approver:
        description: "Who approved promotion (recorded as approval evidence)"
        required: true
        type: string

permissions:
  contents: write   # needed to create the tag, the release, and read the draft
  actions: write    # needed to dispatch publish.yml via workflow_dispatch
  checks: read      # required-check gate lookup

jobs:
  resolve-candidate:
    name: Validate the approved candidate draft
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      candidate_release_id: ${{ inputs.candidate_release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate candidate draft and manifest
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RELEASE_ID: ${{ inputs.candidate_release_id }}
          APPROVER: ${{ inputs.approver }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${CANDIDATE_RELEASE_ID}")"
          DRAFT="$(echo "$RELEASE_JSON" | jq -r '.draft')"
          TARGET="$(echo "$RELEASE_JSON" | jq -r '.target_commitish')"
          TAG_NAME="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"
          if [ "$DRAFT" != "true" ]; then
            echo "Refusing: release ${CANDIDATE_RELEASE_ID} is not a draft (draft=${DRAFT})." >&2
            exit 1
          fi
          if [ "$TAG_NAME" != "candidate-${SHA}" ]; then
            echo "Refusing: candidate tag ${TAG_NAME} does not match candidate-${SHA}." >&2
            exit 1
          fi
          if [ "$TARGET" != "$SHA" ]; then
            echo "Refusing: candidate target_commitish ${TARGET} != resolved commit ${SHA}." >&2
            exit 1
          fi

          # Download the manifest asset BY ASSET ID (never by tag URL — the
          # tag can be repointed, the asset ID cannot).
          ASSET_ID="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "candidate-manifest.json") | .id')"
          if [ -z "$ASSET_ID" ]; then
            echo "Refusing: candidate draft has no candidate-manifest.json asset." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -H "Accept: application/octet-stream" > candidate-manifest.json

          # The manifest must bind to the exact commit being promoted.
          jq -e --arg sha "$SHA" '.commit == $sha' candidate-manifest.json >/dev/null || {
            echo "Refusing: manifest commit does not match ${SHA}." >&2
            exit 1
          }

          VERSION="$(jq -r '.version' candidate-manifest.json)"
          TAG="v${VERSION}"

          # Tag/version/changelog identity preflight, reused unchanged.
          python3 scripts/release_preflight.py \
            --tag "$TAG" \
            --pyproject pyproject.toml \
            --changelog CHANGELOG.md

          # Approval gate: without explicit approval evidence this fails.
          python3 src/superharness/release_candidate.py promote \
            --manifest candidate-manifest.json \
            --approver "$APPROVER" \
            --candidate-release-id "$CANDIDATE_RELEASE_ID"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Candidate ${CANDIDATE_RELEASE_ID} approved and validated: ${TAG} @ ${SHA}"

  verify-ci:
    name: Verify required checks passed on the candidate commit
    needs: resolve-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require branch-protection checks to be green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/required_checks_gate.sh "${{ needs.resolve-candidate.outputs.sha }}"

  release:
    name: Create tag and GitHub Release
    needs: [resolve-candidate, verify-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if release already exists
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-candidate.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for this version
        id: changelog
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.resolve-candidate.outputs.version }}
        run: |
          # Extract the block between ## [VERSION] and the next ## [
          NOTES=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('CHANGELOG.md').read_text()
          pattern = rf'## \[{re.escape(\"$VERSION\")}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, text, re.DOTALL)
          print(m.group(1).strip() if m else 'See CHANGELOG.md for details.')
          ")
          # Write to file to handle multiline safely
          echo "$NOTES" > /tmp/release_notes.txt
          echo "notes_file=/tmp/release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release at the candidate commit
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-candidate.outputs.tag }}
          SHA: ${{ needs.resolve-candidate.outputs.sha }}
        run: |
          gh release create "$TAG" \
            --target "$SHA" \
            --title "superharness $TAG" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --latest

      # GitHub won't trigger publish.yml from a release created by GITHUB_TOKEN,
      # so we dispatch it explicitly via workflow_dispatch, handing over the
      # same candidate release ID so publish uploads the exact stored files.
      - name: Trigger publish workflow
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-candidate.outputs.tag }}
          CANDIDATE_RELEASE_ID: ${{ needs.resolve-candidate.outputs.candidate_release_id }}
        run: |
          gh workflow run publish.yml \
            --ref "$TAG" \
            -f ref="$TAG" \
            -f candidate_release_id="$CANDIDATE_RELEASE_ID"
