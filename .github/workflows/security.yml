name: Security

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gitleaks — the industry-standard secret scanner. Catches real secrets,
  # keys, and high-entropy strings that ShipGuard's rule set does not see.
  # Scans the full history on PRs (fetch-depth: 0) so a secret already
  # committed in a branch is caught before merge, not only at the diff.
  # Job is required by branch protection (required_status_checks "Gitleaks").
  #
  # Runs the MIT-licensed gitleaks BINARY directly rather than the
  # gitleaks-action wrapper: since v2, the action requires a paid
  # GITLEAKS_LICENSE for organization repos ("[org] is an organization.
  # License key is required.") even though the scanner itself is free.
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (MIT-licensed CLI)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: >-
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "${base}/v${GITLEAKS_VERSION}/${asset}" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks.tar.gz
          installed="$(gitleaks version)"
          if [ "$installed" != "$GITLEAKS_VERSION" ]; then
            echo "error: expected gitleaks ${GITLEAKS_VERSION}," \
              "got ${installed}" >&2
            exit 1
          fi
          echo "gitleaks ${installed}"

      - name: Gitleaks secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # PR and merge-group events scan commits after their base; pushes use
          # the event's before SHA, falling back to full history for new branches.
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              ;;
            merge_group)
              base="$MERGE_GROUP_BASE_SHA"
              ;;
            push)
              if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
                base=""
              else
                base="$EVENT_BEFORE"
              fi
              ;;
            *)
              echo "error: unsupported event '$EVENT_NAME' for gitleaks scan" >&2
              exit 1
              ;;
          esac

          if [[ "$EVENT_NAME" != push && -z "$base" ]]; then
            echo "error: event base commit is required for '$EVENT_NAME'" >&2
            exit 1
          fi

          if [[ -n "$base" ]]; then
            if [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "error: event base is not a full commit SHA" >&2
              exit 1
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "error: event base commit is missing from checkout" >&2
              exit 1
            fi
            log_opts=("--log-opts=${base}..HEAD")
          else
            log_opts=()
          fi

          gitleaks detect --source . "${log_opts[@]}" \
            --redact --exit-code 1 --verbose | tee gitleaks-report.txt

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.txt

  shipguard:
    name: ShipGuard Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ShipGuard
        run: pip install "shipguard==0.5.2"

      - name: Run ShipGuard
        run: |
          # pipefail is required: GitHub's default shell is `bash -e {0}`, so a
          # pipeline exits with tee's status (always 0) and a scan that finds
          # CRITICAL issues would pass the build silently.
          set -o pipefail
          shipguard scan . --format terminal | tee shipguard.txt
          sed -n '1,260p' shipguard.txt

      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"

      - name: Run pip-audit (superharness runtime deps only)
        # Extract declared runtime deps from pyproject.toml and audit only those.
        # This avoids false positives from the CI toolchain (shipguard, pip-audit itself).
        # PYSEC-2025-183: disputed CVE in pyjwt (transitive via fastmcp); supplier
        # disputes it, no fix version exists. Ignored until fastmcp pins a clean release.
        run: |
          python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print('\n'.join(d['project']['dependencies']))
          " > /tmp/sh-requirements.txt
          pip-audit -r /tmp/sh-requirements.txt --format json --output pip-audit.json \
            --ignore-vuln PYSEC-2025-183

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shipguard-report
          path: |
            shipguard.txt
            pip-audit.json

  yaml-read-gate:
    name: YAML Read Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install superharness
        run: pip install -e .

      - name: Run audit-self --yaml-only
        run: python -m superharness.commands.audit_self . --yaml-only
