version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    # Dependabot exempts security-advisory PRs from cooldown by design —
    # a fix for a known CVE is proposed immediately regardless of this window.
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    # Dependabot exempts security-advisory PRs from cooldown by design —
    # a fix for a known CVE is proposed immediately regardless of this window.
    cooldown:
      default-days: 7
